[project]
name = "proteus"
version = "0.1.0"
description = "Webhook runner that executes Copilot CLI agents (skill + MCP) for Jira automation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "f0rg3t3ch" }]
requires-python = ">=3.15"
# The runtime is stdlib-only on purpose.
dependencies = []

[dependency-groups]
dev = ["mypy", "pre-commit", "pytest", "pytest-xdist", "ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "A", "RUF", "PT"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
python_version = "3.15"

[tool.pytest]
testpaths = ["tests"]
addopts = ["-n", "4"]
